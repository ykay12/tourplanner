<div class="tour-form-wrapper">
    <section class="tour-form-card">
        <div class="tour-form-header">
            <p class="form-kicker">TourPlanner</p>
            <h2>Edit tour</h2>
            <p class="form-subtitle">
                Update route details, change the type, and save your tour.
            </p>
        </div>

        @if(errorMsg()){
        <div class="alert alert-danger mt-3">
            {{ errorMsg() }}
        </div>
        }

        <form class="tour-form" (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label for="tourname" class="form-label">Tour Name</label>
                <input type="text" class="form-control modern-input" id="tourname" [value]="tourName()"
                    (input)="onTourName($event)" />
            </div>

            <div class="mb-3">
                <label for="tourDescription" class="form-label">Tour Description</label>
                <textarea class="form-control modern-input modern-textarea" id="tourDescription"
                    [value]="tourDescription()" (input)="onTourDescription($event)"></textarea>
            </div>

            <div class="tour-type-group" role="group" aria-label="Tour type">
                @for (type of tourTypes; track type) {
                <input type="radio" class="btn-check" name="tourType" [id]="'radio-' + type"
                    [checked]="tourType() === type" (change)="setTourType(type)" />
                <label class="tour-type-btn" [for]="'radio-' + type">
                    {{ type }}
                </label>
                }
            </div>

            @if (tourType() === "MIXED") {
            <div class="mb-3">
                <label for="from" class="form-label">From</label>
                <input type="text" class="form-control modern-input" id="from" [value]="from()"
                    (input)="onFromInput($event)" />
            </div>

            <div class="mb-4 mixed-steps-box">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <label class="form-label mb-0">Route Segments</label>
                    <button type="button" class="btn add-step-btn" (click)="addSegment()">
                        Add step
                    </button>
                </div>

                @for (segment of segments(); track $index) {
                <div class="step-row">
                    <input type="text" class="form-control modern-input" [value]="segment.to"
                        (input)="onSegmentToChange($index, $event)" placeholder="Next destination" />

                    <select class="form-control modern-input step-select" [value]="segment.transportMode"
                        (change)="onSegmentTransportModeChange($index, $event)">
                        @for (mode of transportModes; track mode) {
                        <option [value]="mode" [selected]="mode === segment.transportMode">{{ mode }}</option>
                        }
                    </select>

                    <button type="button" class="btn remove-step-btn" (click)="removeSegment($index)">
                        Remove
                    </button>
                </div>
                }
            </div>
            } @else {
            <div class="form-row">
                <div class="mb-3">
                    <label for="from" class="form-label">From</label>
                    <input type="text" class="form-control modern-input" id="from" [value]="from()"
                        (input)="onFromInput($event)" />
                </div>

                <div class="mb-3">
                    <label for="to" class="form-label">To</label>
                    <input type="text" class="form-control modern-input" id="to" [value]="to()"
                        (input)="onToInput($event)" />
                </div>
            </div>
            }

            <div class="tour-form-actions">
                <button type="button" class="btn secondary-btn" (click)="onCancel()">
                    Cancel
                </button>

                <button type="submit" class="btn modern-btn mt-2">
                    Save Changes
                </button>
            </div>
        </form>
    </section>
</div>
