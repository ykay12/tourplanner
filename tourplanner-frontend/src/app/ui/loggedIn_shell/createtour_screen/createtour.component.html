<div class="tour-form-wrapper">
  <section class="tour-form-card">
    <div class="tour-form-header">
      <p class="form-kicker">TourPlanner</p>

      <div class ="d-flex justify-content-between gap-3">
        <h2>Create a new tour</h2>

        <button class="modern-btn import-btn" type="button" (click)="fileInput.click()">
          Import Tour
          <img src="assets/icons/import-export.png" alt="Import" class="btn-icon">
        </button>

        <input
          #fileInput
          type="file"
          accept=".json"
          hidden
          (change)="onFileSelected($event)"
        >

      </div>
      
      <p class="form-subtitle">
        Add route details, choose a type, and build your next adventure.
      </p>

    </div>

    @if(errorMsg()){
    <div class="alert alert-danger mt-3">
      {{ errorMsg() }}
    </div>
    }

    <form class="tour-form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="tourname" class="form-label">Tour Name</label>
        <input type="text" class="form-control modern-input" id="tourname" [value]="tourName()"
          (input)="onTourName($event)" />
      </div>

      <div class="mb-3">
        <label for="tourDescription" class="form-label">Tour Description</label>
        <textarea class="form-control modern-input modern-textarea" id="tourDescription" [value]="tourDescription()"
          (input)="onTourDescription($event)"></textarea>
      </div>

      <div class="tour-type-group" role="group" aria-label="Tour type">
        @for (type of tourTypes; track type) {
        <input type="radio" class="btn-check" name="tourType" [id]="'radio-' + type" [checked]="tourType() === type"
          (change)="setTourType(type)" />
        <label class="tour-type-btn" [for]="'radio-' + type">
          {{ type }}
        </label>
        }
      </div>

      @if (tourType() === "MIXED") {
      <div class="mb-3">
        <label for="from" class="form-label">From</label>
        <input type="text" class="form-control modern-input" id="from" [value]="from()" (input)="onFromInput($event)" />
      </div>

      <div class="mb-4 mixed-steps-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <label class="form-label mb-0">Route Segments</label>
          <button type="button" class="btn add-step-btn" (click)="addSegment()">
            Add step
          </button>
        </div>

        @for (segment of segments(); track $index) {
        <div class="step-row">
          <input type="text" class="form-control modern-input" [value]="segment.to"
            (input)="onSegmentToChange($index, $event)" placeholder="Next destination" />

          <select class="form-control modern-input step-select" [value]="segment.transportMode"
            (change)="onSegmentTransportModeChange($index, $event)">
            @for (mode of transportModes; track mode) {
            <option [value]="mode">{{ mode }}</option>
            }
          </select>

          <button type="button" class="btn remove-step-btn" (click)="removeSegment($index)">
            Remove
          </button>
        </div>
        }
      </div>

      <div class="mb-3">
        <label for="to" class="form-label">To</label>
        <input type="text" class="form-control modern-input" id="to" [value]="to()" (input)="onToInput($event)" />
      </div>
      } @else {
      <div class="form-row">
        <div class="mb-3">
          <label for="from" class="form-label">From</label>
          <input type="text" class="form-control modern-input" id="from" [value]="from()"
            (input)="onFromInput($event)" />
        </div>

        <div class="mb-3">
          <label for="to" class="form-label">To</label>
          <input type="text" class="form-control modern-input" id="to" [value]="to()" (input)="onToInput($event)" />
        </div>
      </div>
      }

      <!--
      @if(logs().length > 0) {
        <div class="mt-3">
          <h5>Imported Logs</h5>
          <ul class="list-group">
            @for (log of logs(); track log) {
              <li class="list-group-item">
                <strong>{{ log.createdAt }}</strong> - {{ log.comment }}
              </li>
            }
          </ul>
        </div>
        id: number | null  //muss auf Null setzbar sein, damit im BackendMapper erkannt wird, wenn es sich um einen neuen Logeintrag handelt der angelegt werden muss und nicht um einen bestehenden der geupdatet werden soll
    createdAt: Date, /*Enthält in Typescript auch time*/
    comment: string,
    difficulty: number,
    totalDistance: number,
    totalTime: number /*man erhält die Zeit wohl in Sekunden von der API*/
    rating: number
      }-->

      <button type="submit" class="btn modern-btn mt-2">
        Create Tour
      </button>
    </form>
  </section>
</div>
