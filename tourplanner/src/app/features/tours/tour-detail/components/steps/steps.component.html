<!--steps.component.html-->

<div class="steps-card">
    <div class="steps-card-headline-box">
        <h2 class="steps-card-headline">  Steps  </h2>
    </div>

    <div class="steps-card-scrollable">
        @if (tour; as t) {
            <app-step *ngFor="let step of t.routes" [step]="step"></app-step>
        }
    </div>
</div>
