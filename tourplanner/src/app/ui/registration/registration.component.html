<div class="login-wrapper d-flex align-items-center justify-content-center">

  <form class="login-card" (ngSubmit)="onRegistration()">
    <div class="text-center mb-4">
      <p class="auth-kicker">TourPlanner</p>
      <h2 class="fw-semibold">Create Account</h2>
    </div>

    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control modern-input" id="username" [value]="username()"
        (input)="onUsernameInput($event)">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control modern-input" id="email" [value]="email()" (input)="onEmailInput($event)">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control modern-input" id="password" [value]="password()"
        (input)="onPasswordInput($event)">
    </div>

    <div class="mb-3">
      <label for="passwordRepeat" class="form-label">Repeat Password</label>
      <input type="password" class="form-control modern-input" id="passwordRepeat" [value]="passwordRepeat()"
        (input)="onPasswordRepeatInput($event)">
    </div>

    @if(errorMsg()){
    <div class="alert alert-danger mt-3">
      {{ errorMsg() }}
    </div>
    }
    <button type="submit" class="btn modern-btn w-100 mt-3">
      Create Account
    </button>

    <p class="text-center mt-4 mb-0 small">
      Already have an account?
      <a routerLink="/login" class="signup-link">Login</a>
    </p>

  </form>

</div>
