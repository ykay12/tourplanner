<!-- dashboard.component.html -->

<section class="dashboard-layout">
  <!-- Sidebar / Navigation -->
  <aside class="dashboard-sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <p class="sidebar-label">TourPlanner</p>
        <h2 class="sidebar-title">Overview</h2>
      </div>

      <nav class="sidebar-nav" aria-label="Dashboard Navigation">
        <ul class="sidebar-nav-list">
          <li>
            <a
              routerLink="/dashboard"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="sidebar-button"
            >
              Dashboard
            </a>
          </li>

          <li>
            <a
              routerLink="/dashboard/createtour"
              routerLinkActive="active"
              class="sidebar-button"
            >
              Create new Tour
            </a>
          </li>

          <li>
            <a
              routerLink="/dashboard/tours-overview"
              routerLinkActive="active"
              class="sidebar-button"
            >
              View my Tours
            </a>
          </li>

          <li>
            <a
              routerLink="/dashboard/tour-detail"
              routerLinkActive="active"
              class="sidebar-button"
            >
              Latest viewed Tour
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <div class="sidebar-footer">
      <small>Your smart travel workspace</small>
    </div>
  </aside>

  <!-- Main content -->
  <main class="dashboard-content">
    <router-outlet></router-outlet>
  </main>
</section>
