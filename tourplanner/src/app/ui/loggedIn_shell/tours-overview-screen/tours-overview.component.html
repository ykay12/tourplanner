<!-- tours-overview.component.html -->

<div class="tours-page-card">

  <!-- HEADER -->
  <div class="tours-header">
    <h2>Tours Overview</h2>

    <button class="create-btn, tour-overview-btn" (click)="createTour()">
      + New Tour
    </button>
  </div>

  <!-- SEARCH-BAR -->
  <div class="search-bar">
    <input
      type="text"
      placeholder="Search tours..."
      [value]="searchTerm()" 
      (input)="searchTerm.set($any($event.target).value)"
    />
  </div>

  <!-- LIST of all Tours as TOUR-PREVIEWS -->
  <div class="tours-list">
  @if (filteredTours(); as tours) {

  <ul>
    @for (tour of tours; track tour.id) {
      <li>
        <app-tour-preview
          [tour]="tour"
          (click)="goToTour(tour.id)"
        ></app-tour-preview>
      </li>
    }
  </ul>

} @else {

  <p class="text-center mt-5">
    No tours found. Please create a tour to see it here.
  </p>

}
  </div>
</div>
