<div class="tour-form-wrapper">
  <section class="tour-form-card">
    <div class="tour-form-header">
      <p class="form-kicker">TourPlanner</p>
      <h2>Create a new tour</h2>
      <p class="form-subtitle">
        Add route details, choose a type, and build your next adventure.
      </p>
    </div>

    @if(errorMsg()){
    <div class="alert alert-danger mt-3">
      {{ errorMsg() }}
    </div>
    }

    <form class="tour-form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="tourname" class="form-label">Tour Name</label>
        <input type="text" class="form-control modern-input" id="tourname" [value]="tourName()"
          (input)="onTourName($event)" />
      </div>

      <div class="mb-3">
        <label for="tourDescription" class="form-label">Tour Description</label>
        <textarea class="form-control modern-input modern-textarea" id="tourDescription" [value]="tourDescription()"
          (input)="onTourDescription($event)"></textarea>
      </div>

      <div class="tour-type-group" role="group" aria-label="Tour type">
        @for (type of tourTypes; track type) {
        <input type="radio" class="btn-check" name="tourType" [id]="'radio-' + type" [checked]="tourType() === type"
          (change)="setTourType(type)" />
        <label class="tour-type-btn" [for]="'radio-' + type">
          {{ type }}
        </label>
        }
      </div>

      <div class="form-row">
        <div class="mb-3">
          <label for="from" class="form-label">From</label>
          <input type="text" class="form-control modern-input" id="from" [value]="from()"
            (input)="onFromInput($event)" />
        </div>

        <div class="mb-3">
          <label for="to" class="form-label">To</label>
          <input type="text" class="form-control modern-input" id="to" [value]="to()" (input)="onToInput($event)" />
        </div>
      </div>

      @if (tourType() === "Mixed") {
      <div class="mb-4 mixed-steps-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <label class="form-label mb-0">Route Steps</label>
          <button type="button" class="btn add-step-btn" (click)="addStep()">
            Add step
          </button>
        </div>

        @for (step of steps(); track $index) {
        <div class="step-row">
          <input type="text" class="form-control modern-input" [value]="step" (input)="onStepChange($index, $event)"
            placeholder="Enter route step" />
          <button type="button" class="btn remove-step-btn" (click)="removeStep($index)">
            Remove
          </button>
        </div>
        }
      </div>
      }

      <button type="submit" class="btn modern-btn mt-2">
        Create Tour
      </button>
    </form>
  </section>
</div>
