<div class="steps-card">
  <div class="steps-card-header">
    <h2 class="steps-card-title">Steps</h2>
  </div>

  <div class="steps-card-scrollable">
    @if (tour; as t) {
      @for (step of t.routes; track $index; let i = $index) {
        <app-step [step]="step" [stepNumber]="i + 1"></app-step>
      }
    }
  </div>
</div>
